<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jellydash</title>
</head>
<body>
    <div id="JellydashConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="JellydashConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="HistoryRetentionValue">History retention</label>
                        <input id="HistoryRetentionValue" name="HistoryRetentionValue" type="number" is="emby-input" min="1" />
                        <div class="fieldDescription">How long Jellydash history is kept before cleanup.</div>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="HistoryRetentionUnit">Retention unit</label>
                        <select is="emby-select" id="HistoryRetentionUnit" name="HistoryRetentionUnit" class="emby-select-withcolor emby-select">
                            <option id="optHours" value="Hours">Hours</option>
                            <option id="optDays" value="Days">Days</option>
                        </select>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="TrackDownloads" name="TrackDownloads" type="checkbox" is="emby-checkbox" />
                            <span>Track download activity</span>
                        </label>
                        <div class="fieldDescription">If enabled, Jellydash will also record media downloads as history entries.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var JellydashConfig = {
                pluginUniqueId: '02560995-4de6-45c3-9f4f-47061951af29'
            };

            document.querySelector('#JellydashConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(JellydashConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#HistoryRetentionValue').value = config.HistoryRetentionValue;
                        document.querySelector('#HistoryRetentionUnit').value = config.HistoryRetentionUnit;
                        document.querySelector('#TrackDownloads').checked = config.TrackDownloads;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#JellydashConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(JellydashConfig.pluginUniqueId).then(function (config) {
                        config.HistoryRetentionValue = parseInt(document.querySelector('#HistoryRetentionValue').value, 10);
                        config.HistoryRetentionUnit = document.querySelector('#HistoryRetentionUnit').value;
                        config.TrackDownloads = document.querySelector('#TrackDownloads').checked;
                        ApiClient.updatePluginConfiguration(JellydashConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
